# LendLoop - local n8n automation stack. See n8n/README.md for setup.
#
#   cp n8n/.env.example n8n/.env   # then fill in the secrets
#   docker compose up -d
#
# Secrets (N8N_ENCRYPTION_KEY, LENDLOOP_*_SECRET) are read from the git-ignored
# n8n/.env file via env_file. Nothing secret is committed here.
name: lendloop

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    restart: unless-stopped
    ports:
      # Bound to loopback only: the Convex local backend (a host process) and
      # your browser reach n8n at http://127.0.0.1:5678. Set N8N_BIND_ADDRESS
      # to 0.0.0.0 only if you really need LAN access.
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:5678:5678"
    extra_hosts:
      # Lets workflows call the Convex local backend on the host
      # (LENDLOOP_CONVEX_SITE_URL=http://host.docker.internal:3211).
      - "host.docker.internal:host-gateway"
    env_file:
      # Provides N8N_ENCRYPTION_KEY and the LENDLOOP_* variables
      # (LENDLOOP_N8N_WEBHOOK_SECRET, LENDLOOP_AUTOMATION_SECRET,
      # LENDLOOP_CONVEX_SITE_URL, LENDLOOP_EMAIL_MODE, LENDLOOP_EMAIL_FROM).
      - path: ./n8n/.env
        required: true
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      # Code nodes use require('crypto') for HMAC signing.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Workflows read LENDLOOP_* settings/secrets via $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # No telemetry / phone-home.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      # Execution data includes webhook payloads (recipient email); keep it short-lived.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-168}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      # readiness = DB connected and migrations finished (plain /healthz answers earlier).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  n8n_data:
